global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  # Data-quality metrics pushed by the Airflow validation tasks.
  # honor_labels keeps the job/table labels set at push time.
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]

  # Airflow scheduler / DAG / task metrics (StatsD -> Prometheus)
  - job_name: airflow
    static_configs: [{targets: ["statsd-exporter:9102"]}]

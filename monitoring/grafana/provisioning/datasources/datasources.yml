apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Warehouse (Postgres)
    uid: warehouse-pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    secureJsonData: {password: postgres}
    jsonData:
      database: warehouse
      sslmode: disable
      postgresVersion: 1600
